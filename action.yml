name: Nx remote cache
description: >
  Point Nx at an nx-cache server for the rest of the job. The job's GitHub OIDC token decides what
  it may read and write: the default branch writes the shared cache, a pull request only its own.
  Without a URL, an OIDC token or a reachable server, Nx runs with its local cache.
inputs:
  url:
    description: The cache server's URL, also the audience of the OIDC token. Empty turns the remote cache off.
    required: true
runs:
  using: composite
  steps:
    - name: Trade the job's OIDC token for a cache token
      if: inputs.url != ''
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        set -euo pipefail
        off() { echo "::notice title=Nx remote cache off::$1"; exit 0; }
        [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || off "the job has no id-token: write permission"
        oidc=$(curl -sSf --retry 2 --get --data-urlencode "audience=$URL" \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
          | jq -r .value) || off "GitHub issued no OIDC token"
        grant=$(curl -sSf --retry 2 -X POST -H "Authorization: Bearer $oidc" "$URL/v1/token") \
          || off "$URL refused the token or is unreachable"
        token=$(jq -r .token <<<"$grant")
        echo "::add-mask::$token"
        {
          echo "NX_SELF_HOSTED_REMOTE_CACHE_SERVER=$URL"
          echo "NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN=$token"
        } >> "$GITHUB_ENV"
        jq -r '"Nx remote cache: reads \(.read | join(", ")), writes \(.write // "nothing")"' <<<"$grant"
